services:
  database:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: fihrist
      MYSQL_USER: fihrist
      MYSQL_PASSWORD: fihrist
      MYSQL_ROOT_PASSWORD: fihrist-root
    ports:
      - "3306:3306"
    volumes:
      - fihrist-mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-ufihrist", "-pfihrist"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  fihrist-mysql:
